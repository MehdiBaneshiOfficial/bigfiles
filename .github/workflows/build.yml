name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build
        run: |
          x86_64-w64-mingw32-windres app.rc -O coff -o app.res
          x86_64-w64-mingw32-g++-posix -std=c++17 -Os -flto -ffunction-sections -fdata-sections \
            -municode -mwindows -static -static-libgcc -static-libstdc++ -Wl,--gc-sections -s \
            main.cpp app.res -o BigFiles.exe -lcomctl32 -lshell32 -luxtheme
          ls -l BigFiles.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BigFiles
          path: BigFiles.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BigFiles.exe
